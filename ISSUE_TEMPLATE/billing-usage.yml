name: 计费与用量 / Billing & usage
description: 账单、余额、用量明细相关的疑问
title: "[计费] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        计费口径先看 [文档 · 计费](https://macdecloud.com/docs/billing?utm_source=gh)。
        ⚠️ **不要贴 API Key;也不要贴带地址的后台截图** —— 需要核对账号请走 Telegram 客服。
  - type: dropdown
    id: topic
    attributes:
      label: 想核对什么
      options:
        - 余额与扣费
        - 用量明细 / 导出
        - 失败请求是否计费
        - 缓存与单价
        - 其它
    validations:
      required: true
  - type: input
    id: window
    attributes:
      label: 时间范围
      placeholder: 例:10-12 14:00 – 10-12 15:00(CST)
    validations:
      required: false
  - type: textarea
    id: detail
    attributes:
      label: 现象与你的判断
      description: 你看到什么、预期是什么(不要贴 Key)
    validations:
      required: true
